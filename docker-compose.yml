services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hylo
      POSTGRES_PASSWORD: hylo_dev_password
      POSTGRES_DB: hylo_hub
    ports:
      - "5433:5432"
    volumes:
      - hylo_pgdata:/var/lib/postgresql/data

volumes:
  hylo_pgdata:
